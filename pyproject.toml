[project]
name = "astrbot-plugin-zvv-quest"
version = "1.0.0"
description = "AstrBot plugin for searching Zhang Weiwei memes through ZVVQuest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
]

[[project.authors]]
name = "LYB926"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "live: read-only tests against the current ZVVQuest API",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
